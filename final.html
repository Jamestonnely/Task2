/* Layout: Kezmak-red brand band with the logo, then summary, category filters, and cards grouped by category (Pending Works, Pending Proposals, ...). */
:root{
  --brand:#bf2026; --brand-ink:#ffffff; --brand-deep:#9c1820;
  --bg:#f7f3f3; --surface:#ffffff; --fg:#1d1617; --muted:#6f6264; --line:#e7dcdc;
  --accent:#bf2026; --accent-ink:#ffffff; --accent-soft:#fbe6e8;
  --pending:#a86400; --pending-soft:#fdf1dc;
  --progress:#1f5fa8; --progress-soft:#e3edf9;
  --done:#1f7a4a; --done-soft:#e1f3e8;
  --late:#bf2026;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151112; --surface:#1f191a; --fg:#f3eced; --muted:#a8999b; --line:#342b2c;
  --accent:#ff5a66; --accent-ink:#1a0b0e; --accent-soft:#3a1a1f; --brand-deep:#7d1219;
  --pending:#f0b150; --pending-soft:#3a2c14; --progress:#7fb0ec; --progress-soft:#192a40;
  --done:#6fd39b; --done-soft:#16301f; --late:#ff6b7d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151112; --surface:#1f191a; --fg:#f3eced; --muted:#a8999b; --line:#342b2c;
  --accent:#ff5a66; --accent-ink:#1a0b0e; --accent-soft:#3a1a1f; --brand-deep:#7d1219;
  --pending:#f0b150; --pending-soft:#3a2c14; --progress:#7fb0ec; --progress-soft:#192a40;
  --done:#6fd39b; --done-soft:#16301f; --late:#ff6b7d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--brand)}
.band{background:var(--brand);color:var(--brand-ink)}
.band-in{max-width:1000px;margin:0 auto;padding-block:18px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px}
.band img{height:92px;width:auto;max-width:220px;object-fit:contain;display:block}
.band .titles{flex:1 1 220px;min-width:0;border-left:1px solid rgba(255,255,255,.35);padding-left:20px}
.band h1{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.band p{margin:4px 0 0;font-size:13px;opacity:.9}
.band .tools{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:560px){.band img{height:70px}.band .titles{border-left:none;padding-left:0;flex-basis:100%}}
.wrap{max-width:1000px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:20px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.onbrand{background:#ffffff;border-color:#ffffff;color:#9c1820}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.6);color:#ffffff}
.btn.danger{color:var(--late);border-color:var(--late);background:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.band .btn:focus-visible{outline-color:#ffffff}
.btn[disabled]{opacity:.55;cursor:not-allowed}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.p b{color:var(--pending)} .stat.i b{color:var(--progress)} .stat.d b{color:var(--done)} .stat.l b{color:var(--late)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.filters{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip .c{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] .c{color:var(--bg);opacity:.75}
select,input,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.row select{width:auto;font-size:13px;padding:6px 10px}
.row input[type=search]{flex:1 1 180px;width:auto;font-size:13px;padding:6px 12px}

.groups{display:flex;flex-direction:column;gap:24px}
.group{display:flex;flex-direction:column;gap:10px}
.group h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.group h2 .sw{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted)}
.group h2 .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:auto}
.bar{height:3px;border-radius:2px;width:36px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.late{border-color:var(--late)}
.card .t{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere;background:none;border:none;padding:0;text-align:left;color:var(--fg)}
.card .client{font-size:13px;color:var(--muted);margin-top:-4px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.tag.pending{background:var(--pending-soft);color:var(--pending)}
.tag.progress{background:var(--progress-soft);color:var(--progress)}
.tag.done{background:var(--done-soft);color:var(--done)}
.tag.late{background:var(--late);color:var(--accent-ink)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin:0}
.meta dt{color:var(--muted)} .meta dd{margin:0;font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere;align-self:center}
.meta dd.who{font-family:var(--f-body);font-size:13px;font-weight:600}
.files{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.file{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.file .ext{font-family:var(--f-mono);font-size:10px;font-weight:500;background:var(--accent-soft);color:var(--accent);padding:2px 5px;border-radius:4px}
.file a{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.card .foot{display:flex;justify-content:flex-end}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted)}
.stale{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:13px}
.note{font-size:13px;color:var(--muted);text-align:center;margin:0}

dialog{border:none;padding:0;background:transparent;max-width:min(580px,calc(100vw - 24px));width:100%}
dialog::backdrop{background:rgba(20,10,12,.5)}
.sheet{background:var(--surface);color:var(--fg);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);max-height:calc(100vh - 40px);overflow:auto}
.sheet h3{font-family:var(--f-display);font-size:20px;margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
label > *{text-transform:none;letter-spacing:0;font-weight:400}
.whobox{display:flex;flex-direction:column;gap:8px}
.whobox .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.whobox .hint{text-transform:none;letter-spacing:0;font-weight:400}
.whobox #iOwnerNew{flex:1 1 160px;width:auto}
.upl{border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.upl .hint{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.actions .r{display:flex;gap:8px;margin-left:auto}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:20;max-width:calc(100vw - 32px);text-align:center}

a.btn{text-decoration:none;display:inline-flex;align-items:center}
.card .t{cursor:default}
.card .notes{margin:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
</style>
</head>

    c.appendChild(dl);
    if(it.notes){const n=document.createElement("p");n.className="notes";n.textContent=it.notes;c.appendChild(n)}
    if(/^https?:\/\//i.test(it.file)){const fs=document.createElement("div");fs.className="files";const r=document.createElement("div");r.className="file";
      const e=document.createElement("span");e.className="ext";e.textContent="FILE";const a=document.createElement("a");a.href=it.file;a.target="_blank";a.rel="noopener";a.textContent="Open proposal / file";
      r.append(e,a);fs.appendChild(r);c.appendChild(fs)}
    return c;
  }

  /* ----- downloads ----- */
  const fname=e=>"Kezmak-Task-Board-"+today()+"."+e;
  const rowsFor=c=>sorted(items.filter(i=>catOf(i)===c.k),c.s);
  function exportXlsx(){
    const head=["Category","Task / Proposal","Client","Assignees","Status","Start date","Deadline","Completed","Overdue","Notes","File link"];
    const line=(c,i)=>[c.en,i.title,i.client,ownStr(i),STATUS[i.status],i.start,i.due,i.doneDate,isLate(i)?"Yes":"",i.notes,i.file];
    const wb=XLSX.utils.book_new(),all=[["Kezmak Inc Ltd — Task Board"],["Generated: "+fmt(today())],[],head];
    CATS.forEach(c=>rowsFor(c).forEach(i=>all.push(line(c,i))));
    const ws=XLSX.utils.aoa_to_sheet(all);ws["!cols"]=[18,40,20,24,13,12,12,12,9,40,30].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,"All");
    CATS.forEach(c=>{const s=XLSX.utils.aoa_to_sheet([head.slice(1)].concat(rowsFor(c).map(i=>line(c,i).slice(1))));s["!cols"]=[40,20,24,13,12,12,12,9,40,30].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,s,c.en)});
    XLSX.writeFile(wb,fname("xlsx"));
  }
  function exportPdf(){
    const doc=new window.jspdf.jsPDF({orientation:"landscape",unit:"mm",format:"a4"}),W=doc.internal.pageSize.getWidth();
    doc.setFillColor(191,32,38);doc.rect(0,0,W,30,"F");{const h=24,w=Math.min(36,h*LOGO_RATIO);doc.addImage(LOGO,"PNG",10,3,w,w/LOGO_RATIO)}
    doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text("Task Board",50,14);
    doc.setFont("helvetica","normal");doc.setFontSize(10);const cnt=s=>items.filter(i=>i.status===s).length;
    doc.text("Generated: "+fmt(today())+"   |   Pending: "+cnt("pending")+"   In progress: "+cnt("progress")+"   Completed: "+cnt("done")+"   Overdue: "+items.filter(isLate).length,50,22);
    let y=38;
    CATS.forEach(c=>{const r=rowsFor(c);if(!r.length)return;if(y>175){doc.addPage();y=16}
      doc.setTextColor(29,22,23);doc.setFont("helvetica","bold");doc.setFontSize(12);const lab=c.en+"  ("+r.length+")";doc.text(lab,10,y);const lw=doc.getTextWidth(lab);
      doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(111,98,100);doc.text(c.sub,10+lw+4,y);
      doc.autoTable({startY:y+3,margin:{left:10,right:10},head:[["Task / Proposal","Client","Assignees","Start","Deadline","Completed","Notes"]],
        body:r.map(i=>[i.title+(isLate(i)?"  [OVERDUE]":""),i.client,ownStr(i)||"—",fmt(i.start),fmt(i.due),i.status==="done"?fmt(i.doneDate):"",i.notes]),
        styles:{fontSize:8.5,cellPadding:2,overflow:"linebreak"},headStyles:{fillColor:[191,32,38],textColor:255},alternateRowStyles:{fillColor:[247,243,243]},
        columnStyles:{0:{cellWidth:70},6:{cellWidth:70}}});
      y=doc.lastAutoTable.finalY+10});
    const pages=doc.getNumberOfPages();
    for(let p=1;p<=pages;p++){doc.setPage(p);doc.setFontSize(8);doc.setTextColor(111,98,100);doc.text("Kezmak Inc Ltd  ·  Samora Tower, Posta  ·  Page "+p+"/"+pages,10,doc.internal.pageSize.getHeight()-6)}
    doc.save(fname("pdf"));
  }

  /* ----- wiring ----- */
  if(SHEET_EDIT_URL){$("editLink").href=SHEET_EDIT_URL;$("editLink").hidden=false}
  $("xlsBtn").onclick=()=>{try{exportXlsx()}catch(e){alert("Could not create the Excel file.")}};
  $("pdfBtn").onclick=()=>{try{exportPdf()}catch(e){alert("Could not create the PDF.")}};
  $("reloadBtn").onclick=load;
  $("lateChip").onclick=e=>{f.late=!f.late;e.currentTarget.setAttribute("aria-pressed",f.late?"true":"false");render()};
  $("fOwner").onchange=e=>{f.owner=e.target.value;render()};
  $("fQ").oninput=e=>{f.q=e.target.value;render()};
  load();setInterval(load,120000);
})();

</script>
</body>
</html>
